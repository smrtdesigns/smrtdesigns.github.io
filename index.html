<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smrtdesigns</title>
<style>
  :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --card:#f5f5f7; --accent:#0071e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1c1c1e; --accent:#2997ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:48px 20px 64px; }
  h1 { font-size:34px; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 28px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .card { background:var(--card); border-radius:14px; padding:18px 22px; margin-bottom:12px; }
  .card h2 { font-size:20px; margin:0 0 4px; }
  .card p { margin:0 0 8px; color:var(--muted); }
  footer { margin-top:48px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>smrtdesigns</h1>
  <p class="sub">Simple, focused apps for iPhone.</p>

  <!-- Copy this card for each new app -->
  <div class="card">
    <h2>Workout App</h2>
    <p>A simple workout tracker for logging lifts, sets, reps, and cardio.</p>
    <a href="workout-app/">Support</a> &middot; <a href="workout-app/privacy.html">Privacy Policy</a>
  </div>

  <footer>
    <p>Contact: <a href="mailto:smrtdesignssupport@gmail.com">smrtdesignssupport@gmail.com</a></p>
    <p>&copy; 2026 smrtdesigns</p>
  </footer>
</main>
</body>
</html>
